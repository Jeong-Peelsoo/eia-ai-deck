<!-- ④장 도입 영상 — '숨 쉬는 공간의 해상도' (약 1분 40초 · 나레이션 10씬)
     globe-sdgs-day.html 을 패널 모드로 얹고, 나레이션 씬 경계마다 연출 큐를 쏘아 화면을 몬다.

     설계 규약
     ① **시간표를 여기가 쥔다.** 모듈은 받은 상태만 반영한다(모듈 §10 applyCue).
        큐는 조작 패널이 부르는 그 함수를 그대로 부르므로 손으로 누른 결과와 갈리지 않는다.
     ② **씬 = 나레이션 파일 하나.** 오디오가 끝나면 다음 씬으로 넘어간다 — 절대 시각으로 짜지 않는다.
        재녹음으로 길이가 바뀌어도 그림과 말이 어긋나지 않는다(01편 다큐가 겪은 표류를 피한다).
        ⚠ 그래서 SCENES 와 scripts/generate_intro_tts.py 의 SEGMENTS 는 **개수·순서가 1:1** 이다.
     ③ **느린 확대는 pan 큐**다. 단계 버튼(goStage)의 카메라는 0.25초 지수접근이라 '스크롤'이 안 된다.
        pan 은 모듈의 usr 오프셋(휠·드래그가 얹는 그 값)을 로그축에서 밀어 준다.
     ④ 덱과의 규약은 01편 다큐와 같다 — { deck:'film-close' } · { deck:'film-ui', idle:bool }.
     ⑤ **자막은 한 번에 한 줄**이다. 문장이 길어도 접지 않는다 — 두세 줄이 되면 띠가 두꺼워져
        농도장을 그만큼 가린다. 넘칠 때는 줄이 아니라 활자를 줄인다(fitCap).
     ⑥ **배경음악**은 01편 다큐 폴더의 `우주의신비.mp4`. 시작 2.2초 페이드 인 · 끝 3초 페이드 아웃.
        나레이션이 처음부터 끝까지 이어지므로 구간별 더킹은 두지 않고 0.22 로 낮게 깐다.
     ⑦ **Esc 는 세 곳에서 받는다** — 덱 · 이 페이지 · 모듈(§10). 프레임이 셋이라 포커스가 어디에
        있느냐로 갈리면 안 된다. 모듈의 Esc 는 이 페이지가 덱으로 중계한다.
        그리고 #stage 는 pointer-events:none 이다 — 클릭으로 포커스를 안쪽에 뺏기지 않게.

     ⚠ 물질 — 모듈 자산의 화학종은 PM₂.₅ · NO₂ · O₃ 셋뿐이다(SP_KEYS). PM₁₀ 아틀라스는 굽지 않았다.
       '봄 수송에서 PM 과 NO₂ 를 번갈아'는 PM₂.₅ 로 대신한다. PM₁₀ 이 꼭 필요하면 build_aq_field.py
       부터 다시 구워야 한다(자산·범례·LUT 전부).
     ⚠ 배속은 **씬마다 다르다**(RATE 표) — TTS 는 같은 지시문이어도 클립마다 템포가 ±10 % 흔들려서,
       상수 배속으로는 도입이 빠르고 맺음이 느리게 들렸다(도입 3씬 대비 맺음 2씬 약 -11 %).
       무음을 뺀 발화 시간당 음절 수를 재어 **들리는 속도를 6.6 음절/초로 고르게** 맞춘 값이다.
       1.2 를 넘기면 소리가 들뜨므로 상한이 1.20 이고, 더 줄이려면 배속이 아니라 SEGMENTS 글자 수를 줄인다.
       ⚠ 이 표는 원본(제55회 덱)에서 **손으로 옮겼다**(2026-08-22). 나레이션 mp3 가 원본과 같은
         파일이라 값이 그대로 맞는다 — 다시 구우면 원본 덱의 `scripts/measure_intro_rate.py` 로
         새 표를 받아 온다.
     ⚠ 2026-08-20 씬 8·9 를 더해 8씬 → **10씬**, 약 71.5초 → **약 90초**가 됐다(사용자 지시).
       원본(제55회 덱)에서 손으로 옮겼다 — 이 파일은 fork 라 자동 동기화가 없다.
     ⚠ 2026-09-10 **뒤 절반(46초~)의 연출을 다시 짰고** 09-11 에 61초 뒤를 한 번 더 고쳤다(둘 다 사용자 지시).
       나레이션·씬 수·길이는 그대로다 — 바뀐 것은 큐뿐이다(09-11 에 모듈 pan 큐가 `pease` 를 받게 됐다).
         46~61초  서울까지 확대(50초에 한 단 빨라진다)
         61~69초  서울에서 **한 단만**(z 520 → 1050) · 측정망 ON · 67초 사례 ① 겨울 고농도 PM₂.₅
                  (09-10 판은 두 단 z 2100 까지 내려가 z 700 에서 사례 셋을 5초씩 세웠다)
         69~84초  수도권 배율(z 160)로 물러나며 서울 → 경기 → 강원(홍천)으로 흐른다 —
                  72초 사례 ② 봄 수송 NO₂ · 77초 사례 ③ 오존 고농도 O₃. 도시·교외·산림이 한 화면에 든다
         85~92초  강원 → 한반도 → 동아시아 → 전지구(한반도부터는 09-10 판 그대로 '빠르게')
       사례를 세우는 시각(seek)은 정본의 pick_field_frames.py 가 고른 값이다 — 멎은 창이면 창 하나(WINDOWS),
       흐르는 화면이면 그 경로를 따라 1초마다 잡은 창들(PATHS)의 공간 구배로 고른다.
       ⚠ 이 판도 원본(earth-module)에서 **손으로 옮겼다**(09-10 · 09-11 두 번) — 이 파일은 fork 라 자동 동기화가 없다.
     ⑧ **조작 막대**(.tp) — 재생 바 + 버튼 셋(재생·멈춤·처음부터). 마우스가 멎으면 흐려진다.
        멈춤은 나레이션·음악과 함께 **모듈의 자료 시계·연출 밀기까지** 세운다(모듈 applyCue paused).
        재생 바는 **씬 단위**로 옮긴다 — 지나온 씬 큐를 순서대로 즉시 다시 쏘아 상태를 세운다.
     ⑨ **숏버전**(2026-10-10 사용자 지시 — 약 1분, 연구의 필요성 한 줄기만) — 같은 페이지를 `?cut=short` 로 연다.
        씬 표(SHORT.scenes) · 배속(SHORT.rate) · 나레이션(audio_intro_short/introS*.mp3)만 갈리고
        재생·멈춤·대목 이동·덱 규약은 전체본과 한 코드다. 이 덱에만 있다(earth-module 정본에는 없다).
        나레이션은 tts-1-hd · onyx(사용자 지시)로 scripts/generate_intro_short_tts.py 가 굽고,
        배속 표와 문장 사이 쉼은 scripts/measure_intro_rate.py --cut short --pauses 가 잰다.
        ⚠ 숏버전의 자막·씬 안 큐 시각은 **잰 쉼 자리에 박은 초**다(전체본은 글자 수 비례). 다시 구우면 다시 잰다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>숨 쉬는 공간의 해상도 — 도입 영상</title>
<link href="../graph/vendor/fonts.css" rel="stylesheet">
<style>
  :root{ --ink:#0F1620; --paper:#fff; --accent:#19486A;
         --f:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Noto Sans KR',sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--f)}
  body{outline:none}                    /* tabindex="-1" 로 포커스를 받되 테두리는 그리지 않는다 */
  /* ⚠ pointer-events:none — 이 프레임은 '보는 것'이지 '만지는 것'이 아니다. 클릭을 받게 두면
     화면 아무 데나 누른 순간 포커스가 모듈 문서로 넘어가고, 그때부터 Esc 가 이 페이지에도
     덱에도 닿지 않는다(실제로 그렇게 막혔다). 조작은 시작 오버레이와 덱의 닫기 버튼만 받는다. */
  #stage{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;pointer-events:none}

  /* ── 자막 ─────────────────────────────────────────────────────
     지면이 밝은 낮 지구라 흰 글씨만으로는 읽히지 않는다. 예전에는 검은 띠를 깔았는데
     그 띠가 농도장을 가려, **바탕을 걷고 글자에 검은 윤곽**을 둘러 읽히게 한다(2026-08-17 건화 덱).
     ⚠ 윤곽은 `-webkit-text-stroke` + `paint-order:stroke fill` 이다. paint-order 가 없으면
       획이 글자 안쪽을 절반 갉아먹어 흰 글씨가 야위는데, 이 순서면 윤곽을 **글자 뒤에 먼저**
       칠하므로 흰 획이 원래 굵기를 지킨다(Chrome 144 실측 — 8방향 text-shadow 보다 훨씬 깨끗하다).
       뒤의 흐린 그림자는 밝은 지면에서 글자를 지면과 떼어 놓는 몫이다.
     ⚠ **한 번에 한 줄**이다(사용자 지시). 문장이 길어도 접지 않고 길게 눕힌다 —
       두세 줄이 되면 띠가 두꺼워져 농도장을 그만큼 가린다. 그래서 nowrap 이고,
       화면 폭을 넘칠 때만 fitCap() 이 활자를 한 단씩 줄인다(줄을 늘리지 않는다).
     ⚠ bottom 은 조작 막대(.tp) 위에 앉을 만큼 커야 한다. 실측(Chrome 144) —
       막대 높이 48.2px(1600×900) · 38.9px(1280×720), 막대 윗변은 화면 밑에서 62.6 / 50.5px.
       여기 7.0vh 는 63.0 / 50.4px 이고 `<p>` 의 1em 아래여백이 29px 더 얹혀
       자막 상자 밑변이 92.0 / 79.4px 에 놓인다 — 막대와 29px 떨어진다. */
  /* ⚠ 자막 획 값은 원본(ppt-제55회한일기술사회발표/module)의 최신 조정을 손으로 옮긴 것이다
     (2026-08-18 — 획 3.2→4px · 굵기 600→700 · 그림자 재조정). 이 파일은 fork 라 자동 동기화가 없다.
     `bottom` 만 덱 조판에 맞춘 값을 그대로 둔다 — 이 덱은 자막이 막대와 겹치지 않게 더 낮게 앉힌다. */
  .cap{position:fixed;left:50%;bottom:clamp(46px,7.0vh,80px);transform:translateX(-50%);
    z-index:20;max-width:96vw;white-space:nowrap;text-align:center;
    padding:clamp(11px,1.6vh,18px) clamp(20px,2.2vw,36px);
    color:#fff;font-size:34px;font-weight:700;line-height:1.35;letter-spacing:-.02em;
    -webkit-text-stroke:4px #000;paint-order:stroke fill;
    text-shadow:0 2px 9px rgba(0,0,0,.55);
    opacity:0;transition:opacity .3s ease}
  .cap.on{opacity:1}

  /* ── 머리 표식 — 지금 무엇을 보고 있는가(사례·물질·배율) ──────── */
  .tag{position:fixed;left:clamp(26px,2.6vw,48px);top:clamp(22px,2.6vh,38px);z-index:20;
    display:flex;align-items:center;gap:11px;
    background:rgba(8,14,22,.72);padding:9px clamp(14px,1.4vw,20px);
    color:#fff;font-size:clamp(16px,1.219vw,21px);font-weight:700;letter-spacing:.02em;
    opacity:0;transition:opacity .4s ease}
  .tag.on{opacity:1}
  .tag i{display:flex;gap:4px}
  .tag i b{width:11px;height:11px;display:block}
  .tag i b:nth-child(1){background:#4C9F38}   /* SDG 3 */
  .tag i b:nth-child(2){background:#FD6925}   /* SDG 9 */
  .tag i b:nth-child(3){background:#FD9D24}   /* SDG 11 */
  .tag i b:nth-child(4){background:#3F7E44}   /* SDG 13 */
  .tag i b:nth-child(5){background:#19486A}   /* SDG 17 */
  .tag em{font-style:normal;font-weight:500;color:#b9c4cf}

  /* ── 조작 막대 — 재생 바 + 버튼 셋(재생 · 멈춤 · 처음부터) ──────
     ⚠ 작게 둔다. 이 화면의 주인공은 농도장이고 조작부는 발표자만 쓰는 물건이다.
       마우스가 멎으면 자막을 뺀 나머지(표식·조작부)가 함께 흐려진다(wake).
     ⚠ 자막이 이 위에 앉으므로 자막 bottom 은 이 막대 높이보다 커야 한다 — 아래 .cap 참조. */
  .tp{position:fixed;left:50%;bottom:clamp(10px,1.6vh,18px);transform:translateX(-50%);z-index:22;
    display:flex;align-items:center;gap:clamp(8px,0.9vw,13px);
    padding:clamp(6px,0.9vh,10px) clamp(11px,1.1vw,16px);
    background:rgba(8,14,22,.74);backdrop-filter:blur(3px);
    width:min(62vw,860px)}
  .tb{appearance:none;border:0;background:rgba(255,255,255,.13);color:#fff;cursor:pointer;
    width:clamp(26px,2vw,32px);height:clamp(26px,2vw,32px);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s ease}
  .tb:hover{background:var(--accent)}
  .tb[aria-pressed="true"]{background:var(--accent)}
  /* 아이콘은 도형으로 그린다 — 글꼴 기호는 기기마다 모양이 달라진다 */
  .ic{display:block}
  .ic.play{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;
    border-left:10px solid currentColor;margin-left:2px}
  .ic.pause{width:10px;height:12px;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor}
  .ic.rew{width:11px;height:11px;border:2px solid currentColor;border-radius:50%;
    border-top-color:transparent;transform:rotate(-45deg)}
  .track{flex:1;height:5px;background:rgba(255,255,255,.20);cursor:pointer;position:relative}
  .track i{display:block;height:100%;width:0;background:#7FB2D6;transition:width .25s linear}
  .tm{flex:0 0 auto;font-size:clamp(13px,0.95vw,16px);color:#c6d0da;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .idleoff{opacity:0;transition:opacity .5s ease;pointer-events:none}

  /* ── 시작 오버레이 — 소리 있는 재생은 사용자 제스처가 있어야 열린다.
       01편 다큐와 같은 문법(클릭 또는 Enter·Space)이라 발표자가 새로 배울 것이 없다. ── */
  .gate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(16px,2.4vh,28px);
    background:rgba(6,10,16,.90);color:#fff;cursor:pointer;text-align:center;padding:6vw}
  .gate.off{display:none}
  .gate h1{margin:0;font-size:clamp(34px,3.9vw,66px);font-weight:700;letter-spacing:-.04em;line-height:1.12}
  .gate h1 em{font-style:normal;color:#7FB2D6}
  .gate p{margin:0;font-size:clamp(19px,1.6vw,26px);color:#c6d0da;font-weight:500;line-height:1.5;max-width:52ch}
  .gate .go{display:flex;align-items:center;gap:13px;background:#fff;color:#0F1620;
    padding:clamp(14px,2vh,20px) clamp(24px,2.6vw,40px);
    font-size:clamp(21px,1.79vw,29px);font-weight:700;letter-spacing:-.01em}
  .gate .go .tri{width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;
    border-left:15px solid #0F1620;display:block}
  .gate .meta{font-size:clamp(15px,1.15vw,19px);color:#8a97a4;font-weight:500}
</style>
</head>

<div class="tag" id="tag"><i><b></b><b></b><b></b><b></b><b></b></i><span id="tagT">전지구</span>

};
/* 판 고르기 — 덱 ④장의 두 버튼이 같은 페이지를 다른 주소로 연다(전체본 · ?cut=short). */
const CUT_SHORT = new URLSearchParams(location.search).get('cut') === 'short';
const SCENES = CUT_SHORT ? SHORT.scenes : SCENES_FULL;
const RATE = CUT_SHORT ? SHORT.rate : RATE_FULL;
const GAP  = CUT_SHORT ? SHORT.gap : 200;   // 씬 사이 쉼(ms) — 말이 붙어 들리지 않을 만큼만
if (CUT_SHORT){
  document.getElementById('gateDur').textContent = SHORT.label;
  // 숏버전은 카메라가 멎는 씬이 없어 1km 자산(약 9 MB)과 수도권 상세지도를 시작 화면 뒤에서 읽어 둔다
  stage.addEventListener('load', () => send(SHORT.warm), { once: true });
}

/* ── 나레이션 — 씬마다 파일 하나. 미리 받아 두어야 씬 사이가 끊기지 않는다. ── */
const AUD = SCENES.map((_, i) => {
  const a = new Audio(`${CUT_SHORT ? SHORT.audio : 'audio_intro/intro'}${i}.mp3`);
  a.preload = 'auto'; a.playbackRate = RATE[i]; a.volume = 1;
  return a;
});
/* 남은 길이 — 진행 막대에 쓴다. 메타데이터가 오기 전에는 어림값(10초)으로 둔다.
   ⚠ **리드인(LEAD)도 센다**(2026-08-22 정정). 빼고 세면 시계가 처음부터 3초 어긋난 채 끝까지 간다.
   ⚠ 그래도 표시는 실제보다 **3초쯤 짧다.** 씬이 바뀔 때마다 play() 를 부른 뒤 소리가 실제로
     나기까지 걸리는 지연이 얹히는데(실측 4~590 ms, 뒤 씬일수록 커진다) 기기·브라우저마다 달라
     미리 셀 수가 없다. 1600×900 크로미엄 실측 — 표시 1:34 · 실제 **1:37.4**. 발표 시간을 잡을 때는
     표시가 아니라 실측을 쓴다. */
function totalSec(){
  return LEAD / 1000 + AUD.reduce((s, a, i) => s + ((a.duration || 10) / RATE[i]), 0)
         + (SCENES.length - 1) * GAP / 1000;
}

function send(cue){ stage.contentWindow?.postMessage({ cue }, '*'); }

let idx = -1, started = false, paused = false, midTimers = [], capTimers = [], barTimer = 0,
    leadT = 0, leadAt = 0, sceneTok = 0;                // sceneTok — 숏버전의 'playing' 대기를 무르는 표(showScene 참조)
/* 씬 길이(초) — 배속을 먹인 실제 오디오 길이. 메타데이터가 아직 없으면 어림값을 준다. */
function sceneSec(i){ return (AUD[i].duration || 10) / RATE[i]; }
/* 지난 시간 — **오디오 위치에서 되읽는다.** 벽시계로 재면 멈춤·되감기에서 곧바로 어긋난다.
   ⚠ 리드인만 예외다 — 그동안은 읽을 오디오가 없어 벽시계로 센다(씬 0 이 서면 LEAD 로 고정된다). */
function elapsedSec(){
  if (!started) return 0;
  if (idx < 0) return Math.min(LEAD, performance.now() - leadAt) / 1000;
  let s = LEAD / 1000;
  for (let i = 0; i < idx; i++) s += sceneSec(i) + GAP / 1000;
  return s + (AUD[idx].currentTime || 0) / RATE[idx];
}
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function putTag(t){ tagT.textContent = t[0]; tagS.textContent = t[1]; }   // 머리 표식 — 씬도 씬 안의 큐도 부른다

/* 자막 한 줄 — 넣고, 넘치면 활자를 줄인다(줄을 늘리지 않는다).
   nowrap 이라 폭이 화면을 넘으면 잘려 나가므로, 들어갈 때까지 한 단씩 내린다.
   기준은 34px 이고(2026-10-10 사용자 지시로 29 → 34, 숏버전 · 전체본 함께), 하한 19px 은 덱의 소형 활자 규격이다.
   실측(헤드리스 크롬) — 1600×900 · 1280×720 모두 전체본 · 숏버전 자막이 34px 그대로 한 줄에 든다(줄임 0). */
/* ⚠ 2026-10-10 — 고정 34px 은 큰 화면(2560×1440 · 4K)에서 29px 과 구별되지 않았다(사용자 'F5 해도 원래대로').
   1600×900 을 기준으로 화면의 가로 · 세로 배율 중 작은 쪽만큼 키운다. 그보다 작은 화면에서는 34px 아래로 줄이지 않는다
   (1280×720 에서도 34px 한 줄에 든다 — 실측). 넘치면 아래 루프가 한 단씩 줄인다. */
const CAP_BASE = 34, CAP_MIN = 19;
const capMax = () => Math.round(CAP_BASE * Math.max(1, Math.min(innerWidth / 1600, innerHeight / 900)));
function putCap(text){
  const max = capMax();
  cap.style.fontSize = max + 'px';
  cap.textContent = text;
  /* max-width 가 96vw 라 넘치는 글은 상자 밖으로 흘러나간다 — offsetWidth 는 상한에 걸려 더 안 커지므로
     넘침 판정은 scrollWidth > clientWidth 로 한다(폭을 재는 게 아니라 넘쳤는지를 본다). */
  for (let fs = max; fs > CAP_MIN && cap.scrollWidth > cap.clientWidth; fs -= 1)
    cap.style.fontSize = fs + 'px';
  cap.classList.add('on');
}
/* 씬 안의 자막 계획 — [씬 시작 후 초, 글]. 줄 길이(글자 수)에 비례해 시간을 나눈다.
   나레이션이 문장 길이에 비례해 읽히므로 이 배분이 실제 발화와 가장 가깝다.
   ⚠ 계획과 예약을 나눠 둔 이유 — 멈췄다 다시 재생할 때 **남은 것만** 다시 걸어야 하기 때문이다. */
function capPlan(i){
  const lines = SCENES[i].caps, dur = sceneSec(i);
  // 숏버전 — [초, 글] 로 적힌 줄은 잰 쉼 자리(들리는 초) 그대로 쓴다(SHORT 머리 주석)
  if (lines.every(Array.isArray)) return lines.map(([at, line]) => [at, line]);
  const tot = lines.reduce((s, l) => s + l.length, 0);
  let acc = 0;
  return lines.map(line => { const at = acc; acc += dur * (line.length / tot); return [at, line]; });
}
function armTimers(i, fromSec){
  for (const t of capTimers) clearTimeout(t);
  for (const t of midTimers) clearTimeout(t);
  const plan = capPlan(i);
  // 이미 지난 줄 중 마지막 것을 즉시 띄운다 — 되감기·재개 직후 자막이 비어 있으면 안 된다
  const past = plan.filter(([at]) => at <= fromSec);
  if (past.length) putCap(past[past.length - 1][1]);
  capTimers = plan.filter(([at]) => at > fromSec).map(([at, line]) => setTimeout(() => {
    cap.classList.remove('on');
    setTimeout(() => putCap(line), 160);
  }, (at - fromSec) * 1000));
  // 씬 안의 큐 — 지난 것은 즉시 반영하고, 남은 것만 다시 건다.
  //   세 번째 자리는 머리 표식이다(선택). 서울 배율의 세 사례는 **한 씬 안에서** 갈리므로
  //   표식이 씬 경계에만 매여 있으면 화면은 오존인데 표식은 봄 수송으로 남는다.
  for (const [at, cue, tg] of (SCENES[i].mid || [])){
    const fire = () => { send(cue); if (tg) putTag(tg); };
    if (at <= fromSec) fire();
    else midTimers.push(setTimeout(fire, (at - fromSec) * 1000));
  }
}
function showScene(i){
  const s = SCENES[i];
  idx = i;
  /* pan 은 씬이 끝나는 그 순간에 함께 끝난다 — 확대가 먼저 멎으면 남은 말이 정지 화면 위에서 돈다.
     0.98 은 마지막 한 숨을 정지 상태로 남겨 다음 씬 전환이 튀지 않게 하는 여유다.
     ⚠ 씬 안에서 확대를 미리 끝내 두는 `panFrac` 을 한때 두었다가 걷었다(2026-08-20). 확대를 앞으로
       몰면 씬 끝마다 정지 화면이 생기는데, 씬 5~7 을 **쉼 없이 하나로 잇기로** 하면서 그 정지가
       오히려 방해가 됐다. 지금은 큐의 `ease`(in → linear → out)가 그 몫을 대신한다. */
  const cue = s.cue.pan ? { ...s.cue, pan: { ...s.cue.pan, sec: sceneSec(i) * 0.98 } } : s.cue;
  send(cue);
  putTag(s.tag);

  const a = AUD[i];
  a.currentTime = 0; a.playbackRate = RATE[i];
  a.play().catch(() => { /* 재생이 막히면 게이트를 다시 연다 */ openGate(); });
  a.onended = () => { if (i + 1 < SCENES.length) setTimeout(() => showScene(i + 1), GAP); else finish(); };
  /* 숏버전 — 자막 · 씬 안 큐를 **소리가 실제로 난 순간**('playing')에 건다(2026-10-10). play() 를 부른 뒤 소리가 나기까지
     뒤 씬일수록 길어져(헤드리스 실측 0.2 → 1.1초) play() 시각에 걸면 자막과 연출이 말보다 그만큼 앞섰다. 숏버전의 자막
     시각은 소리에 맞춰 잰 값이라 그 어긋남이 그대로 보인다. 전체본은 종전대로 곧바로 건다 — 그 시간표(씬 7 의 12.5초 등)가
     이 지연을 셈에 넣고 짜였다. */
  if (CUT_SHORT){
    const tok = ++sceneTok;
    a.addEventListener('playing', () => { if (tok === sceneTok && !paused) armTimers(i, a.currentTime / RATE[i]); },
                       { once: true });
  } else armTimers(i, 0);                               // 오디오가 흐르기 시작한 뒤에 잡아야 duration 이 있다
}
/* ── 조작 — 멈춤·재생·처음부터·대목 이동 ────────────────────────────
   ⚠ 되감기·이동은 **그 대목까지의 큐를 순서대로 즉시 다시 쏘아** 모듈 상태를 세운다.
     씬 큐는 앞 씬 상태에 얹히는 값(특히 pan 의 배율)이라, 목표 씬 큐만 보내면 화면이 어긋난다.
     별도의 '절대 상태 표'를 두는 방법도 있으나 SCENES 와 이중 관리가 되어 반드시 갈라진다. */
function jumpTo(k){
  for (const t of capTimers) clearTimeout(t);
  for (const t of midTimers) clearTimeout(t);
  for (const a of AUD){ a.pause(); a.currentTime = 0; a.onended = null; }
  // 지나온 큐는 즉시 반영한다 — 확대(pan)와 1km 와이프(km1Wipe, 2026-10-02)는 시간을 0.01초로 접는다
  const instant = c => ({ ...c, ...(c.pan ? { pan: { ...c.pan, sec: 0.01 } } : {}),
                                ...(c.km1Wipe ? { km1Wipe: { ...c.km1Wipe, sec: 0.01 } } : {}) });
  for (let i = 0; i < k; i++){
    send(instant(SCENES[i].cue));                       // 지나온 확대는 즉시 반영
    // 씬 안의 큐도 같은 규약이다 — 확대는 즉시 반영한다. 확대를 여러 다리로 나눠 mid 에 두면서
    //   이 자리가 중요해졌다(씬 5·6). 그대로 보내면 지나온 다리들이 **지금** 애니메이션을 걸어
    //   마지막 다리만 살아남고, 멈춘 상태에서 뛰면 그 밀기가 멈춘 시간만큼 뒤로 밀려 서지 않는다.
    for (const [, cue, tg] of (SCENES[i].mid || [])){
      send(instant(cue));
      if (tg) putTag(tg);
    }
  }
  setPaused(false);
  showScene(k);
}
function setPaused(on){
  if (on === paused) return;
  paused = on;
  sceneTok++;                                           // 기다리던 'playing' 걸기를 무른다 — 다시 재생하면 아래에서 직접 건다
  send({ paused: on });                                 // 모듈의 자료 시계·연출 밀기를 함께 세운다
  if (on){
    AUD[idx]?.pause(); bgm.pause();
    for (const t of capTimers) clearTimeout(t);
    for (const t of midTimers) clearTimeout(t);
  } else if (idx >= 0){
    const a = AUD[idx];
    a.play().catch(() => {});
    if (bgm.currentTime > 0) bgm.play().catch(() => {});
    armTimers(idx, a.currentTime / RATE[idx]);          // 남은 자막·큐만 다시 건다
  }
  tbPlay.setAttribute('aria-pressed', String(!on));
  tbPause.setAttribute('aria-pressed', String(on));
}
function finish(){
  cap.classList.remove('on');
  barI.style.width = '100%';
  fadeMusic(0, 3000);                                   // 말이 끝나면 음악이 3초에 걸쳐 물러난다
  /* 끝나도 화면은 그대로 둔다 — 마지막 그림(동아시아를 정면에 둔 지구본)이 발표자의 다음 말과 이어진다.
     장을 닫는 것은 발표자다(Esc). 자동으로 닫으면 말이 끊긴 자리에서 덱이 튀어나온다. */
}

function tick(){
  if (!started) return;
  const el = elapsedSec(), tot = totalSec();
  barI.style.width = Math.min(100, el / tot * 100).toFixed(2) + '%';
  tm.textContent = `${mmss(el)} / ${mmss(tot)}`;
}
/* ── 배경음악 — 페이드 인·아웃 ────────────────────────────────────
   나레이션이 처음부터 끝까지 이어지므로 다큐처럼 구간별 더킹을 두지 않는다. 낮게 깔고
   시작에 2.2초 들어왔다가 끝에 3초로 물러난다. 0.22 는 나레이션(-12 LUFS) 밑에서
   존재만 느껴지는 값이다 — 더 올리면 말과 다툰다. */
const bgm = document.getElementById('bgm');
const MUSIC_VOL = CUT_SHORT ? SHORT.music : 0.22;   // 숏버전은 나레이션이 앞에 서게 한 단 낮춘다(2026-10-10 '목소리 크게')
let fadeT = 0;
function fadeMusic(to, ms){
  clearInterval(fadeT);
  const from = bgm.volume, t0f = performance.now();
  fadeT = setInterval(() => {
    const u = Math.min(1, (performance.now() - t0f) / ms);
    bgm.volume = Math.max(0, Math.min(1, from + (to - from) * u));
    if (u >= 1){ clearInterval(fadeT); if (to === 0) bgm.pause(); }
  }, 40);
}
function startMusic(){
  bgm.volume = 0;
  bgm.play().then(() => fadeMusic(MUSIC_VOL, 2200)).catch(() => {});
}

/* 시작 후 나레이션까지의 여유(ms). 재생을 누르자마자 말이 나오면 청중이 화면을 볼 틈이 없다 —
   음악과 지구본이 3초 먼저 자리를 잡고 그 위에 첫 문장이 얹힌다.
   ⚠ 이 3초 동안 화면은 **iframe 의 src 매개변수가 세운 상태**(전지구·연간·0.25배속) 그대로다.
     씬0 큐를 미리 쏘지 않는다 — goStage 가 파면(reveal)을 재무장해 3초 뒤 번짐이 다시 시작된다. */
const LEAD = CUT_SHORT ? SHORT.lead : 3000;            // 숏버전은 2.5초 — 첫 화면에 오래 머물지 않는다
function start(){
  if (started) return;
  started = true;
  gate.classList.add('off');
  tag.classList.add('on');
  /* 포커스를 이 문서로 끌어온다 — 아래 keydown(Esc)이 여기서 걸린다.
     프레임(#stage)은 pointer-events:none 이라 클릭으로 포커스를 뺏기지 않는다. */
  document.body.focus();
  leadAt = performance.now();                          // 시계가 이 3초도 센다(elapsedSec 참조)
  barTimer = setInterval(tick, 250);
  startMusic();
  leadT = setTimeout(() => { if (started) showScene(0); }, LEAD);
}
/* 전면 정지 — 덱이 장을 닫을 때 부른다. 프레임을 비우기 전에 **소리를 먼저 끊는다**. */
function stopAll(){
  clearTimeout(leadT); clearInterval(barTimer);
  for (const t of capTimers) clearTimeout(t);
  for (const t of midTimers) clearTimeout(t);
  for (const a of AUD){ a.pause(); a.onended = null; a.currentTime = 0; }
  clearInterval(fadeT); bgm.pause(); bgm.currentTime = 0;
  started = false; paused = false; idx = -1; sceneTok++;
  cap.classList.remove('on'); tag.classList.remove('on');
  gate.classList.remove('off');
}
function openGate(){ gate.classList.remove('off'); }

/* ── 조작 막대 배선 ─────────────────────────────────────────────── */
const tp = document.getElementById('tp'), track = document.getElementById('track');
const tbPlay = document.getElementById('tbPlay'), tbPause = document.getElementById('tbPause');
const tbRestart = document.getElementById('tbRestart'), tm = document.getElementById('tm');
tbPlay.addEventListener('click', e => { e.stopPropagation(); started ? setPaused(false) : start(); });
tbPause.addEventListener('click', e => { e.stopPropagation(); if (started) setPaused(true); });
tbRestart.addEventListener('click', e => {
  e.stopPropagation();
  if (!started){ start(); return; }
  bgm.currentTime = 0; startMusic();
  jumpTo(0);
});
/* 재생 바 — 누른 자리의 비율을 **씬 단위**로 옮긴다. 씬 안쪽 초 단위 이동은 두지 않았다 —
   나레이션 한가운데서 끊고 들어가면 말이 잘려 들리고, 발표에서 쓸 일도 없다. */
track.addEventListener('click', e => {
  e.stopPropagation();
  if (!started) return;
  const r = track.getBoundingClientRect();
  const want = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * totalSec();
  let acc = LEAD / 1000, k = 0;                        // 막대 왼쪽 끝의 리드인 몫
  for (let i = 0; i < SCENES.length; i++){
    const end = acc + sceneSec(i) + GAP / 1000;
    if (want < end){ k = i; break; }
    acc = end; k = i;
  }
  jumpTo(k);
});

gate.addEventListener('click', start);
/* ⚠ Esc 는 세 곳에서 받는다 — 어디에 포커스가 있어도 닫히게 하기 위해서다.
     ① 덱 문서(발표.html)            ② 이 페이지(아래)      ③ 모듈 문서(globe-sdgs-day §10)
   ③은 이 페이지로 { deck:'film-close' } 를 올리고, 이 페이지가 덱으로 중계한다(아래 message).
   capture 단계에서 듣는 이유 — 게이트가 포커스를 쥔 상태에서도 먼저 걸리게. */
addEventListener('keydown', e => {
  if (e.key === 'Escape'){ e.preventDefault(); stopAll(); parent.postMessage({ deck:'film-close' }, '*'); return; }
  if (!started && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')){ e.preventDefault(); start(); }
}, true);
addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  /* 재생 신호 — 규약은 남겨 두되 **덱은 더 이상 이것을 보내지 않는다**(2026-08-15 사용자 지시).
     장을 열면 시작 화면에서 멈춰 서 있고, Enter·클릭·재생 버튼을 받아야 흐른다. */
  if (d.film === 'play') start();
  /* 덱이 장을 닫을 때 — 프레임이 비워지기 전에 소리를 확실히 끊는다.
     ⚠ 이게 필요한 이유: 덱이 iframe.src 에 **같은 값**을 다시 넣어도 문서가 다시 읽히지 않는다(실측).
       그래서 '알아서 파괴되겠지' 를 믿을 수 없다. 스스로 멎어야 한다. */
  if (d.film === 'stop') stopAll();
  /* 모듈에서 올라온 Esc 를 덱으로 중계한다 — 중간에 낀 프레임이 벽이 되면 안 된다. */
  if (d.deck === 'film-close'){ stopAll(); parent.postMessage({ deck:'film-close' }, '*'); }
});

/* 조작부 걷기 — 마우스가 멎으면 머리 표식과 조작 막대가 흐려진다(자막은 남는다).
   덱의 닫기 버튼도 같이 걷도록 알린다. 흐려진 동안은 pointer-events 도 꺼져 실수로 눌리지 않는다. */
let idleT;
function wake(){
  for (const el of [tag, tp]) el.classList.remove('idleoff');
  parent.postMessage({ deck:'film-ui', idle:false }, '*');
  clearTimeout(idleT);
  idleT = setTimeout(() => {
    for (const el of [tag, tp]) el.classList.add('idleoff');
    parent.postMessage({ deck:'film-ui', idle:true }, '*');
  }, 2200);
}
addEventListener('mousemove', wake, { passive:true });
addEventListener('keydown', wake);
wake();
})();
</script>
</body>
</html>
